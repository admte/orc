[workspace]
members = [
    "crates/orc-access",
    "crates/orc-app",
    "crates/orc-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
blake3 = "1"
bytes = "1.10.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
console = "0.15.11"
fastcdc = { version = "4.0.1", default-features = false }
futures-util = { version = "0.3.31", default-features = false }
globset = "0.4.18"
http = "1.3.1"
indicatif = "0.17.9"
infer = "0.19.0"
libc = "0.2"
prost = "0.14.1"
protoc-bin-vendored = "3.2.0"
rand = "0.9.2"
rcgen = { version = "=0.14.7", features = ["x509-parser"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
regex = "1.12.2"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = "1.0.203"
serde_json = "1.0.117"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
tempfile = "3.23.0"
thiserror = "2"
time = "0.3"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-stream = { version = "0.1.18", features = ["net", "sync"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tonic = { version = "0.14.2", features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
tracing = "0.1.44"
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Keep direct emptiness assertions without requiring element equality or debug output.
assert_is_empty = "allow"
similar_names = "allow"
